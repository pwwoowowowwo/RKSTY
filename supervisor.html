<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول الرقباء - نظام فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 0; }

        /* شاشة طلب الكود السري */
        #authScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e293b; display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: white; padding: 35px; border-radius: 20px;
            text-align: center; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .auth-box h2 { color: var(--primary); margin-bottom: 20px; }
        .auth-box input {
            width: 100%; padding: 15px; margin-bottom: 20px;
            border: 2px solid #e2e8f0; border-radius: 12px; font-size: 18px; text-align: center; box-sizing: border-box;
        }
        .btn-auth {
            background: var(--accent); color: white; border: none; width: 100%;
            padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        /* محتوى الصفحة (مخفي) */
        #mainContent { display: none; padding: 20px; max-width: 1100px; margin: auto; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-right: 5px solid var(--accent); }
        
        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: #f8fafc; color: #64748b; }
        
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .approved { background: #dcfce7; color: #166534; }
        .pending { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-box">
            <h2>🔑 دخول الرقباء</h2>
            <p style="color: #64748b; font-size: 0.9rem;">أدخل الكود السري الخاص بك لعرض بياناتك</p>
            <input type="password" id="svCode" placeholder="أدخل الكود هنا">
            <button class="btn-auth" onclick="loginSupervisor()">دخول النظام</button>
        </div>
    </div>

    <div id="mainContent">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="color: var(--primary);">لوحة التحكم الخاصة</h1>
            <button onclick="location.reload()" style="background:#e74c3c; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">خروج</button>
        </div>

        <div class="card">
            <h3>🪪 بياناتك الرسمية</h3>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الرتبة</th>
                        <th>رقم الهوية</th>
                        <th>رقم الجوال</th>
                    </tr>
                </thead>
                <tbody id="profileData"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>⏳ متابعة الطلبات الموجهة للإدارة</h3>
            <table>
                <thead>
                    <tr>
                        <th>اسم الفرد</th>
                        <th>الطلب</th>
                        <th>الوقت</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="reqTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loginSupervisor() {
            const code = document.getElementById('svCode').value;
            if(!code) return;

            // التحقق من الكود في قسم الرقباء بالسحابة
            db.ref('supervisors').once('value', (snapshot) => {
                let userFound = false;
                snapshot.forEach((child) => {
                    const data = child.val();
                    if(data.secretCode === code) {
                        userFound = true;
                        showDashboard(data);
                    }
                });

                if(!userFound) {
                    alert("الكود غير صحيح! يرجى مراجعة الدعم الفني.");
                    document.getElementById('svCode').value = "";
                }
            });
        }

        function showDashboard(userData) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            // عرض البيانات الشخصية
            document.getElementById('profileData').innerHTML = `
                <tr>
                    <td><b>${userData.name}</b></td>
                    <td>${userData.rank}</td>
                    <td>${userData.nationalId}</td>
                    <td>${userData.phone}</td>
                </tr>`;

            // جلب طلبات الأفراد
            db.ref('requests').on('value', (snapshot) => {
                const table = document.getElementById('reqTable');
                table.innerHTML = '';
                snapshot.forEach(child => {
                    const req = child.val();
                    if(req.directedToAdmin) {
                        table.innerHTML += `
                            <tr>
                                <td>${req.userName}</td>
                                <td>${req.requestType}</td>
                                <td>${req.directionTime || '-'}</td>
                                <td><span class="status-badge ${req.adminAction === 'approved' ? 'approved' : 'pending'}">
                                    ${req.adminAction === 'approved' ? '✅ مقبول' : '⏳ قيد المعالجة'}</span></td>
                            </tr>`;
                    }
                });
            });
        }
    </script>
</body>
</html>
