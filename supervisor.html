<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الرقيب - نظام فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --success: #059669; --warning: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--primary); }
        .container { max-width: 800px; margin: auto; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; border-right: 5px solid var(--accent); }
        .request-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .user-info h3 { margin: 0; color: var(--primary); font-size: 18px; }
        .user-info p { margin: 5px 0; color: #64748b; font-size: 14px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-approved { background: #dcfce7; color: #166534; }
        
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; }
        .btn-direct { background: var(--accent); color: white; }
        .btn-direct:hover { background: #1d4ed8; }
        .btn-reject { background: #fee2e2; color: #dc2626; }
        
        .empty-state { text-align: center; padding: 50px; color: #94a3b8; }
        .info-row { display: flex; gap: 15px; margin-top: 8px; font-size: 13px; color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 22px;">إدارة طلبات الميدان</h1>
        <p style="margin:5px 0 0 0; opacity: 0.8;">الرقيب المسؤول: فهد المخلفي</p>
    </div>

    <div id="requestsList">
        <div class="empty-state">جاري تحميل الطلبات الجديدة...</div>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب الطلبات الخاصة بهذا الرقيب (أو كل الطلبات غير الموجهة للإدارة بعد)
    db.ref('requests').on('value', snapshot => {
        const listContainer = document.getElementById('requestsList');
        listContainer.innerHTML = '';
        let hasRequests = false;

        snapshot.forEach(child => {
            const req = child.val();
            
            // عرض الطلبات التي لم توجه للإدارة بعد ولم يتم رفضها
            if (!req.directedToAdmin && !req.adminAction && req.status !== 'rejected') {
                hasRequests = true;
                listContainer.innerHTML += `
                    <div class="card">
                        <div class="request-header">
                            <div class="user-info">
                                <h3>${req.userName}</h3>
                                <p>الرتبة: ${req.userRank || 'غير محدد'}</p>
                            </div>
                            <span class="badge badge-pending">طلب جديد</span>
                        </div>
                        <div class="info-row">
                            <span>📅 التاريخ: ${req.requestDate || '-'}</span>
                            <span>⏳ المدة: <b>${req.duration || 'يوم'}</b></span>
                        </div>
                        <div style="margin-top:10px; font-size: 14px; color: #1e293b;">
                            <strong>نوع الطلب:</strong> ${req.requestType}
                        </div>
                        <div class="actions">
                            <button class="btn btn-direct" onclick="directToAdmin('${child.key}')">الموافقة وتوجيه للإدارة 🏛️</button>
                            <button class="btn btn-reject" onclick="rejectRequest('${child.key}')">رفض</button>
                        </div>
                    </div>
                `;
            }
        });

        if (!hasRequests) {
            listContainer.innerHTML = '<div class="empty-state">لا توجد طلبات معلقة حالياً.</div>';
        }
    });

    // وظيفة توجيه الطلب للإدارة (مع إقرار تغطية الموقع)
    function directToAdmin(reqId) {
        if (confirm("هل تقر بأن الموقع مغطى وتوافق على توجيه الطلب للشؤون الإدارية؟")) {
            db.ref('requests/' + reqId).update({
                directedToAdmin: true,
                directedBy: "فهد المخلفي", // سيتم تسجيل اسمك كمسؤول وجه الطلب
                status: "موجه للإدارة",
                timestamp: new Date().getTime()
            }).then(() => {
                alert("تم توجيه الطلب بنجاح للإدارة.");
            });
        }
    }

    // وظيفة الرفض الميداني
    function rejectRequest(reqId) {
        const reason = prompt("يرجى كتابة سبب الرفض:");
        if (reason) {
            db.ref('requests/' + reqId).update({
                status: "rejected",
                rejectReason: reason,
                adminAction: "rejected"
            });
        }
    }
</script>

</body>
</html>
