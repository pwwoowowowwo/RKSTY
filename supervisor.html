<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام الإدارة المتكامل - فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --danger: #dc2626; --success: #059669; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 1350px; margin: auto; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 5px solid var(--primary); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        /* شريط البحث */
        .search-box { flex: 1; min-width: 300px; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; outline: none; }
        .search-box:focus { border-color: var(--accent); }

        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #f1f1f1; text-align: center; }
        th { background: #f8fafc; color: #64748b; font-size: 0.9rem; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-excel { background: #15803d; color: white; }
        .btn-approve { background: var(--success); color: white; }
        .btn-print { background: var(--accent); color: white; }

        /* نافذة التنبيه الأحمر المنبثقة */
        #alertModal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .alarm-card { background: white; width: 400px; margin: 12% auto; padding: 35px; border-radius: 20px; text-align: center; border: 4px solid var(--danger); animation: border-pulse 2s infinite; }
        @keyframes border-pulse { 0% { border-color: #dc2626; } 50% { border-color: #f87171; } 100% { border-color: #dc2626; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .badge-count { background: #eff6ff; color: var(--accent); padding: 5px 12px; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body>

<audio id="notificationSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<div id="alertModal">
    <div class="alarm-card">
        <div style="font-size: 60px; animation: pulse 1s infinite;">🚨</div>
        <h2 style="color: #991b1b;">تنبيه: طلب جديد واصل!</h2>
        <p style="color: #4b5563; font-weight: bold;">فهد، يوجد طلب رخصة بانتظار قرار الإدارة الآن.</p>
        <button onclick="closeAlert()" style="background: var(--danger); color: white; border: none; padding: 15px 40px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px;">مشاهدة الطلبات</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="header-flex">
            <h2>📥 طلبات الاستئذان الجديدة</h2>
        </div>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th><th>الرتبة</th><th>الهوية</th><th>التاريخ</th><th>المدة</th><th>إجراء</th>
                </tr>
            </thead>
            <tbody id="pendingRequests"></tbody>
        </table>
    </div>

    <div class="card">
        <div class="header-flex">
            <h2>🗃️ أرشيف الرخص المعتمدة</h2>
            <input type="text" id="searchInput" onkeyup="filterArchive()" class="search-box" placeholder="🔍 ابحث بالاسم أو رقم الهوية...">
            <button class="btn btn-excel" onclick="exportToExcel()">📊 تصدير للاكسل</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th><th>الرتبة</th><th>رقم الهوية</th><th>الجوال</th><th>إجمالي الرخص</th><th>خيارات</th>
                </tr>
            </thead>
            <tbody id="archiveTable"></tbody>
        </table>
    </div>
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let lastCount = 0;

    // 1. مراقبة الطلبات الجديدة وتفعيل التنبيه الأحمر
    db.ref('requests').on('value', snapshot => {
        const pendingBody = document.getElementById('pendingRequests');
        pendingBody.innerHTML = '';
        let currentCount = 0;

        snapshot.forEach(child => {
            const req = child.val();
            if (req.directedToAdmin && !req.adminAction) {
                currentCount++;
                pendingBody.innerHTML += `
                    <tr>
                        <td><b>${req.userName}</b></td>
                        <td>${req.userRank || '-'}</td>
                        <td>${req.userID || '-'}</td>
                        <td>${req.requestDate || '-'}</td>
                        <td><span style="color:var(--accent); font-weight:bold;">${req.duration || 'يوم'}</span></td>
                        <td><button class="btn btn-approve" onclick="approveAndArchive('${child.key}')">اعتماد ✅</button></td>
                    </tr>`;
            }
        });

        if (currentCount > lastCount) { showAlert(); }
        lastCount = currentCount;
        document.title = currentCount > 0 ? `(${currentCount}) طلبات جديدة` : "نظام الإدارة";
    });

    function showAlert() {
        document.getElementById('alertModal').style.display = 'block';
        document.getElementById('notificationSound').play();
        if (window.navigator.vibrate) window.navigator.vibrate([500, 200, 500]);
    }

    function closeAlert() { document.getElementById('alertModal').style.display = 'none'; }

    // 2. الاعتماد والأرشفة
    function approveAndArchive(reqId) {
        db.ref('requests/' + reqId).once('value', snapshot => {
            const reqData = snapshot.val();
            const dateStr = new Date().toLocaleDateString('ar-SA');
            const idKey = reqData.userID || reqData.userName;

            db.ref('requests/' + reqId).update({ adminAction: 'approved' });

            const archiveRef = db.ref('archive').child(idKey);
            archiveRef.once('value', arcSnap => {
                let data = arcSnap.exists() ? arcSnap.val() : { count: 0, history: [] };
                archiveRef.set({
                    name: reqData.userName, rank: reqData.userRank || '-',
                    idNo: reqData.userID || '-', phone: reqData.userPhone || '-',
                    shift: reqData.shift || '-', directedBy: reqData.directedBy || '-',
                    count: data.count + 1,
                    history: [...data.history, { date: reqData.requestDate || dateStr, duration: reqData.duration || 'يوم واحد' }]
                });
            });
            alert("تم الاعتماد بنجاح.");
        });
    }

    // 3. عرض الأرشيف والبحث
    db.ref('archive').on('value', snapshot => {
        const archiveBody = document.getElementById('archiveTable');
        archiveBody.innerHTML = '';
        snapshot.forEach(child => {
            const p = child.val();
            archiveBody.innerHTML += `
                <tr>
                    <td><b>${p.name}</b></td><td>${p.rank}</td><td>${p.idNo}</td><td>${p.phone}</td>
                    <td><span class="badge-count">${p.count} رخصة</span></td>
                    <td><button class="btn btn-print" onclick="printOfficialForm('${child.key}')">🖨️ طباعة النموذج</button></td>
                </tr>`;
        });
    });

    function filterArchive() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.getElementById('archiveTable').getElementsByTagName('tr');
        for (let row of rows) {
            const name = row.cells[0].textContent.toLowerCase();
            const id = row.cells[2].textContent.toLowerCase();
            row.style.display = (name.includes(filter) || id.includes(filter)) ? "" : "none";
        }
    }

    // 4. تصدير الاكسل
    function exportToExcel() {
        db.ref('archive').once('value', snapshot => {
            const excelData = [];
            snapshot.forEach(child => {
                const p = child.val();
                const row = { "الاسم": p.name, "الهوية": p.idNo, "الإجمالي": p.count };
                p.history.forEach((h, i) => { row[`رخصة ${i+1}`] = `${h.date} (${h.duration})`; });
                excelData.push(row);
            });
            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "الأرشيف");
            XLSX.writeFile(wb, `الأرشيف_${new Date().toLocaleDateString()}.xlsx`);
        });
    }

    // 5. الطباعة الرسمية A4
    function printOfficialForm(idKey) {
        db.ref('archive/' + idKey).once('value', snapshot => {
            const p = snapshot.val();
            const lastReq = p.history[p.history.length - 1];
            const printWindow = window.open('', '', 'height=900,width=850');
            printWindow.document.write(`
                <html dir="rtl"><head><style>
                    @page { size: A4; margin: 15mm; }
                    body { font-family: 'Segoe UI', sans-serif; padding: 20px; }
                    .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                    th, td { border: 1px solid #000; padding: 10px; text-align: center; font-size: 14px; }
                    .label { background: #f8fafc; font-weight: bold; }
                </style></head><body>
                    <div class="header"><h1>نموذج طلب رخصة استئذان</h1><p>نظام فهد المخلفي</p></div>
                    <table>
                        <tr><td class="label">الاسم</td><td><b>${p.name}</b></td><td class="label">الرتبة</td><td>${p.rank}</td><td class="label">الهوية</td><td>${p.idNo}</td></tr>
                        <tr><td class="label">التاريخ</td><td>${lastReq.date}</td><td class="label">المدة</td><td colspan="3" style="background:#fff9c4"><b>${lastReq.duration}</b></td></tr>
                    </table>
                    <div style="border:1px solid #000; padding:15px; margin-top:20px;">
                        أقر أنا الرقيب/ <b>${p.directedBy}</b> بأن الموقع مغطى بالكامل وتحت مسؤوليتي.
                    </div>
                    <div style="border:1px solid #000; padding:15px; margin-top:10px;">تم اعتماد الرخصة رسمياً برقم استلام (<b>${p.count}</b>).</div>
                    <div style="display:flex; justify-content:space-between; margin-top:50px;">
                        <div style="text-align:center; width:45%;"><b>توقيع الرقيب</b><br><br>........</div>
                        <div style="text-align:center; width:45%;"><b>ختم الإدارة</b><br><br>........</div>
                    </div>
                </body></html>`);
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); }, 500);
        });
    }
</script>
</body>
</html>
