<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الرقباء - نظام فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --bg: #eef2f3; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .login-container { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .dashboard { max-width: 800px; margin: auto; display: none; }
        .req-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-right: 8px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .info-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .badge { background: #f0f4f8; color: var(--primary); padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; border: 1px solid #dce4ec; }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 10px; text-align: center; font-size: 18px; }
        button { cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-login { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 10px; width: 100%; }
        .btn-approve { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 8px; width: 100%; font-size: 16px; }
        .sup-header { background: var(--primary); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="loginSection" class="login-container">
        <div style="font-size: 50px;">👮</div>
        <h2>دخول الرقباء</h2>
        <p style="color: #666;">أدخل الرمز السري الخاص بك</p>
        <input type="password" id="supPass" placeholder="****">
        <button class="btn-login" onclick="supLogin()">تسجيل الدخول</button>
    </div>

    <div id="mainDash" class="dashboard">
        <div class="sup-header">
            <div>
                <span id="supName" style="font-size: 20px; font-weight: bold;"></span><br>
                <span id="supRank" style="font-size: 14px; opacity: 0.8;"></span>
            </div>
            <button onclick="location.reload()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:8px; border-radius:8px;">خروج</button>
        </div>

        <h3 style="color: var(--primary); margin-bottom: 15px;">📥 طلبات الأفراد الموجهة لك:</h3>
        <div id="requestsList">
            <p style="text-align:center; color:#999;">جاري البحث عن طلبات...</p>
        </div>
    </div>

    <script>
        // الرابط السحابي الخاص بك
        const firebaseConfig = { 
            databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSupID = "";

        // دالة الدخول وتدقيق الصلاحيات
        function supLogin() {
            let pass = document.getElementById('supPass').value;
            if(!pass) return alert("يرجى إدخال الرمز");

            db.ref('settings/supervisors/' + pass).once('value', snap => {
                if(snap.exists()) {
                    let supData = snap.val();
                    currentSupID = pass;
                    
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('mainDash').style.display = 'block';
                    
                    document.getElementById('supName').innerText = "مرحباً: " + supData.name;
                    document.getElementById('supRank').innerText = "الرتبة: " + supData.rank;
                    
                    listenToRequests(pass);
                } else {
                    alert("❌ الرمز غير صحيح");
                }
            });
        }

        // دالة عرض الطلبات المفلترة لهذا الرقيب فقط
        function listenToRequests(supID) {
            db.ref('requests').on('value', snap => {
                let container = document.getElementById('requestsList');
                container.innerHTML = "";
                let hasData = false;

                snap.forEach(child => {
                    let r = child.val();
                    // الفلترة: الرقيب المختار هو أنا والحالة "قيد الانتظار"
                    if(r.target === supID && (r.status.includes("الانتظار") || r.status === "new")) {
                        hasData = true;
                        container.innerHTML += `
                            <div class="req-card">
                                <div style="font-size: 18px; font-weight: bold; color: var(--primary);">${r.name}</div>
                                <div class="info-row">
                                    <span class="badge">📅 التاريخ: ${r.date}</span>
                                    <span class="badge">🕒 الوردية: ${r.shift}</span>
                                    <span class="badge">⏳ المدة: ${r.duration}</span>
                                </div>
                                <div style="background: #f9f9f9; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 14px;">
                                    <b>الملاحظات:</b> ${r.reason || 'لا يوجد'}
                                </div>
                                <button class="btn-approve" onclick="approveRequest('${child.key}')">الموافقة وتحويلها للإدارة ⬅️</button>
                            </div>
                        `;
                    }
                });

                if(!hasData) {
                    container.innerHTML = `<div style="text-align:center; padding:50px; color:#999; background:white; border-radius:15px;">لا توجد طلبات جديدة موجهة لك.</div>`;
                }
            });
        }

        // تحويل الطلب للإدارة
        function approveRequest(reqID) {
            if(confirm("موافقة على الطلب وتحويله للشؤون الإدارية؟")) {
                db.ref('requests/' + reqID).update({
                    status: "to_admin",
                    adminReply: "تمت موافقة الرقيب، بانتظار الاعتماد النهائي."
                }).then(() => {
                    alert("تم التحويل بنجاح");
                });
            }
        }
    </script>
</body>
</html>
