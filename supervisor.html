<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الرقباء - نظام فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --success: #059669; --warning: #d97706; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 1100px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 4px solid var(--accent); }
        h2 { font-size: 1.2rem; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        
        /* جداول البيانات */
        .table-wrapper { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 600px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        th { background: #f1f5f9; color: #475569; }
        
        /* حالات الطلب */
        .status { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .status-pending { background: #fef3c7; color: #92400e; } /* قيد الانتظار */
        .status-approved { background: #dcfce7; color: #166534; } /* تم القبول */
        .status-rejected { background: #fee2e2; color: #991b1b; } /* تم الرفض */

        .profile-info { background: #f0f7ff; border: 1px solid #cfe2ff; }
    </style>
</head>
<body>

<div class="container">
    <div class="card profile-info">
        <h2>🪪 بيانات الرقيب المسؤول</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الرتبة</th>
                        <th>رقم الهوية</th>
                        <th>رقم الجوال</th>
                    </tr>
                </thead>
                <tbody id="profileData">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>📩 طلبات الاستئذان الواردة</h2>
        <p style="font-size: 0.8rem; color: #64748b;">هنا تظهر طلبات الأفراد لاعتمادها أو توجيهها للإدارة.</p>
        <div id="newRequests">
            </div>
    </div>

    <div class="card" style="border-top-color: var(--warning);">
        <h2>⏳ متابعة الطلبات الموجهة للإدارة</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>اسم الفرد</th>
                        <th>نوع الطلب</th>
                        <th>وقت التوجيه</th>
                        <th>حالة الطلب لدى الإدارة</th>
                    </tr>
                </thead>
                <tbody id="followUpList">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب بيانات الرقيب من الذاكرة المحلية (التي خزنها نظام الدعم الفني عند الدخول)
    const currentName = localStorage.getItem('currentSupervisor');
    
    // 1. جلب بيانات الرقيب الكاملة من قاعدة البيانات لعرضها في الجدول العلوي
    db.ref('supervisors').orderByChild('name').equalTo(currentName).on('value', snapshot => {
        const profileBody = document.getElementById('profileData');
        profileBody.innerHTML = '';
        snapshot.forEach(child => {
            const data = child.val();
            profileBody.innerHTML = `
                <tr>
                    <td><b>${data.name}</b></td>
                    <td>${data.rank}</td>
                    <td>${data.nationalId}</td>
                    <td>${data.phone}</td>
                </tr>`;
        });
    });

    // 2. جلب الطلبات ومتابعة الحالات
    db.ref('requests').on('value', snapshot => {
        const followUpList = document.getElementById('followUpList');
        const newRequests = document.getElementById('newRequests');
        
        followUpList.innerHTML = '';
        newRequests.innerHTML = '';

        snapshot.forEach(child => {
            const req = child.val();
            
            // حالة متابعة الطلبات الموجهة للإدارة
            if (req.directedToAdmin === true) {
                let statusClass = 'status-pending';
                let statusText = 'قيد معالجة الإدارة';
                
                if (req.adminAction === 'approved') { statusClass = 'status-approved'; statusText = 'تم القبول'; }
                if (req.adminAction === 'rejected') { statusClass = 'status-rejected'; statusText = 'مرفوض'; }

                followUpList.innerHTML += `
                    <tr>
                        <td>${req.userName}</td>
                        <td>${req.requestType}</td>
                        <td>${req.directionTime || 'غير محدد'}</td>
                        <td><span class="status ${statusClass}">${statusText}</span></td>
                    </tr>`;
            }
            
            // الطلبات الجديدة التي لم توجه بعد (للمعالجة)
            else if (!req.actionBy) {
                // كود عرض البطاقات لاتخاذ إجراء (قبول/رفض/توجيه)
                // ... (نفس الكود السابق لمعالجة الطلبات)
            }
        });
    });

    // وظيفة توجيه الطلب للإدارة (تحدث الحالة ليظهر في جدول المتابعة)
    function directToAdmin(reqId) {
        db.ref('requests/' + reqId).update({
            directedToAdmin: true,
            directionTime: new Date().toLocaleTimeString(),
            directedBy: currentName
        }).then(() => {
            alert("تم توجيه الطلب للإدارة بنجاح");
        });
    }
</script>
</body>
</html>
</html>
