<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الدعم الفني - إدارة فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --primary: #1a365d;
            --accent: #2d3748;
            --success: #2f855a;
            --danger: #c53030;
            --bg: #edf2f7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9rem;
        }

        input {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            color: white;
        }

        .btn-add { background: var(--success); width: 100%; }
        .btn-update { background: var(--primary); width: 100%; }
        .btn-delete { background: var(--danger); padding: 5px 10px; font-size: 12px; }

        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        th { background: #f7fafc; color: #718096; }

        .secret-badge {
            background: #fff5f5;
            color: #c53030;
            padding: 4px 8px;
            border-radius: 5px;
            font-family: monospace;
            border: 1px solid #feb2b2;
        }

        @media (min-width: 992px) {
            .main-container { grid-template-columns: 2fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1 style="margin:0;">🛠️ لوحة الدعم الفني</h1>
        <p style="margin:5px 0 0; opacity: 0.8;">إدارة بيانات الرقباء ورموز الشؤون الإدارية</p>
    </div>

    <div class="main-container">
        
        <div class="card">
            <h2>👥 إضافة رقباء جدد</h2>
            <div class="form-grid">
                <div class="input-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="supName" placeholder="الاسم الرباعي">
                </div>
                <div class="input-group">
                    <label>الرتبة</label>
                    <input type="text" id="supRank" placeholder="الرتبة">
                </div>
                <div class="input-group">
                    <label>رقم الهوية</label>
                    <input type="number" id="supID">
                </div>
                <div class="input-group">
                    <label>رقم الجوال</label>
                    <input type="text" id="supPhone">
                </div>
                <div class="input-group">
                    <label>الرمز السري</label>
                    <input type="text" id="supPass" placeholder="رمز الدخول">
                </div>
            </div>
            <button class="btn btn-add" onclick="addSup()">حفظ وإرسال للسحابة ✅</button>

            <div class="table-responsive">
                <h3>السجلات الحالية</h3>
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>الرتبة</th>
                            <th>الهوية</th>
                            <th>الرمز</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="supList"></tbody>
                </table>
            </div>
        </div>

        <div class="card" style="border-top: 5px solid var(--primary);">
            <h2>🔐 إدارة رمز الشؤون الإدارية</h2>
            <p style="font-size: 0.8rem; color: #718096; margin-bottom: 20px;">تغيير الرمز الذي يفتح قسم الشؤون الإدارية من الصفحة الرئيسية.</p>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>الرمز السري الجديد</label>
                <input type="text" id="adminPass" placeholder="أدخل الرمز الجديد">
            </div>
            <button class="btn btn-update" onclick="updateAdminPass()">تحديث الرمز الآن</button>
        </div>

    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // إضافة رقيب
        function addSup() {
            const name = document.getElementById('supName').value;
            const rank = document.getElementById('supRank').value;
            const idNo = document.getElementById('supID').value;
            const phone = document.getElementById('supPhone').value;
            const pass = document.getElementById('supPass').value;

            if(!name || !pass || !idNo) { alert("أكمل البيانات المطلوبة"); return; }

            db.ref('supervisors').push({
                name: name,
                rank: rank,
                nationalId: idNo,
                phone: phone,
                secretCode: pass
            }).then(() => {
                alert("تمت الإضافة بنجاح!");
                document.querySelectorAll('.card input:not(#adminPass)').forEach(i => i.value = '');
            });
        }

        // عرض القائمة
        db.ref('supervisors').on('value', (snapshot) => {
            const list = document.getElementById('supList');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <tr>
                        <td><b>${data.name}</b></td>
                        <td>${data.rank}</td>
                        <td>${data.nationalId}</td>
                        <td><span class="secret-badge">${data.secretCode}</span></td>
                        <td><button class="btn btn-delete" onclick="deleteSup('${child.key}')">حذف</button></td>
                    </tr>`;
            });
        });

        function deleteSup(id) {
            if(confirm("هل أنت متأكد من الحذف؟")) db.ref('supervisors/' + id).remove();
        }

        // تحديث رمز الشؤون الإدارية
        function updateAdminPass() {
            const newPass = document.getElementById('adminPass').value;
            if(!newPass) return;
            db.ref('adminSettings/adminSecretCode').set(newPass).then(() => {
                alert("تم تحديث رمز الإدارة بنجاح ✅");
                document.getElementById('adminPass').value = '';
            });
        }
    </script>
</body>
</html>
