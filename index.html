<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الرخص - فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 5px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .menu-item {
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-user { background-color: #3498db; }
        .btn-sup { background-color: #2c3e50; }
        .btn-admin { background-color: #27ae60; }
        
        .menu-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">📋</div>
        <h1>نظام الرخص الرقمي</h1>
        <p>مرحباً بك في نظام إدارة الرخص والاستئذان</p>

        <div class="menu-grid">
            <a href="Apply.html" class="menu-item btn-user">
                <span>📝</span> تقديم طلب جديد
            </a>

            <a href="supervisor.html" class="menu-item btn-sup">
                <span>👮</span> لوحة الرقباء
            </a>

            <a href="admin.html" class="menu-item btn-admin">
                <span>🏢</span> الشؤون الإدارية
            </a>
        </div>

        <div class="footer">
            تطوير وإشراف: فهد مرزوق المخلفي
        </div>
    </div>

</body>
</html>
