<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدعم الفني - التحكم السحابي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #2c3e50; --danger: #e74c3c; --success: #27ae60; --accent: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 15px; }
        .section { background: #f9f9f9; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #eee; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; }
        .btn { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-save { background: var(--success); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; padding: 5px 12px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background: #f4f7f6; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة الدعم الفني والإعدادات ⚙️</h2>

    <div class="section">
        <h3>👥 إضافة وإدارة الرقباء</h3>
        <div class="grid-inputs">
            <input type="text" id="sName" placeholder="اسم الرقيب">
            <input type="text" id="sRank" placeholder="الرتبة">
            <input type="text" id="sPass" placeholder="الرمز السري">
        </div>
        <button class="btn btn-save" onclick="addSupervisor()">إضافة وتفعيل الصلاحيات ➕</button>
        
        <table>
            <thead>
                <tr><th>الاسم</th><th>الرتبة</th><th>الرمز</th><th>إجراء</th></tr>
            </thead>
            <tbody id="supTableBody"></tbody>
        </table>
    </div>

    <div class="section">
        <h3>🔐 رمز دخول الشؤون الإدارية</h3>
        <div style="display:flex; gap:10px;">
            <input type="text" id="admPass" placeholder="أدخل الرمز الجديد">
            <button class="btn" style="background:var(--primary); color:white;" onclick="updateAdminPass()">تحديث</button>
        </div>
    </div>

    <button onclick="window.location.href='home.html'" style="width:100%; padding:15px; background:#bdc3c7; border:none; border-radius:10px; font-weight:bold;">العودة للرئيسية</button>
</div>

<script>
    // الرابط السحابي الخاص بك
    const firebaseConfig = { 
        databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function loadSupervisors() {
        db.ref('settings/supervisors').on('value', (snap) => {
            let tbody = document.getElementById('supTableBody');
            tbody.innerHTML = "";
            if (snap.exists()) {
                snap.forEach((child) => {
                    let s = child.val();
                    tbody.innerHTML += `<tr>
                        <td>${s.name}</td>
                        <td>${s.rank}</td>
                        <td>****</td>
                        <td><button class="btn btn-danger" onclick="deleteSup('${child.key}')">حذف</button></td>
                    </tr>`;
                });
            }
        });
    }

    function addSupervisor() {
        let name = document.getElementById('sName').value;
        let rank = document.getElementById('sRank').value;
        let pass = document.getElementById('sPass').value;

        if(!name || !rank || !pass) return alert("أكمل البيانات");

        db.ref('settings/supervisors/' + pass).set({
            name: name,
            rank: rank
        }).then(() => {
            alert("✅ تمت الإضافة بنجاح");
            document.getElementById('sName').value = "";
            document.getElementById('sRank').value = "";
            document.getElementById('sPass').value = "";
        }).catch(err => alert("خطأ: تأكد من تعديل الـ Rules"));
    }

    function deleteSup(id) {
        if(confirm("حذف الرقيب؟")) db.ref('settings/supervisors/' + id).remove();
    }

    function updateAdminPass() {
        let p = document.getElementById('admPass').value;
        db.ref('settings/adminPass').set(p).then(() => alert("تم التحديث"));
    }

    loadSupervisors();
</script>
</body>
</html>
