<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الرقباء المطورة - فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 25px; border-bottom: 4px solid var(--accent); }
        .request-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .table-container { background: white; border-radius: 15px; overflow-x: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        th { background: #f8f9fa; color: var(--primary); font-weight: bold; position: sticky; top: 0; }
        .btn { padding: 8px 15px; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; }
        .btn-approve { background: var(--success); }
        .btn-reject { background: var(--danger); }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .badge-success { background: #e8f8f5; color: #27ae60; }
        .badge-danger { background: #fdedec; color: #e74c3c; }
        .reason-input { width: 100%; padding: 10px; margin-top: 15px; border: 1px solid #ddd; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>لوحة إدارة الرخص والاستئذان</h2>
        <p>بإشراف: فهد مرزوق المخلفي</p>
    </div>

    <h3>📥 طلبات تحتاج إجراء</h3>
    <div id="new-requests"></div>

    <h3>🕒 سجل المتابعة (يتضمن بيانات المسؤول عن الإجراء)</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم الفرد</th>
                    <th>رتبة الفرد</th>
                    <th>هوية الفرد</th>
                    <th>جوال الفرد</th>
                    <th>نوع الطلب</th>
                    <th>الحالة</th>
                    <th>سبب الرفض</th>
                    <th style="background: #eef2f3;">اسم الرقيب المسؤول</th>
                    <th style="background: #eef2f3;">رتبة الرقيب</th>
                </tr>
            </thead>
            <tbody id="completed-table"></tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // الحصول على بيانات الرقيب الحالي المسجل دخوله
        const currentSupName = localStorage.getItem('currentSupervisor') || "غير مسجل";
        const currentSupRank = localStorage.getItem('currentSupervisorRank') || "رقيب";

        db.ref('requests').on('value', (snapshot) => {
            const newDiv = document.getElementById('new-requests');
            const tableBody = document.getElementById('completed-table');
            newDiv.innerHTML = ''; tableBody.innerHTML = '';

            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    const id = child.key;

                    if (data.status === 'pending') {
                        newDiv.innerHTML += `
                            <div class="request-card">
                                <strong>👤 ${data.name} - ${data.rank}</strong>
                                <p>هوية: ${data.nationalId} | جوال: ${data.phone}</p>
                                <p>الطلب: ${data.type}</p>
                                <input type="text" id="reason-${id}" class="reason-input" placeholder="اكتب سبب الرفض...">
                                <div style="margin-top:10px;">
                                    <button class="btn btn-approve" onclick="process('${id}', 'approved')">موافقة ✅</button>
                                    <button class="btn btn-reject" id="btn-r-${id}" onclick="document.getElementById('reason-${id}').style.display='block'; this.style.display='none'; document.getElementById('btn-c-${id}').style.display='inline-block';">رفض ❌</button>
                                    <button class="btn btn-reject" id="btn-c-${id}" style="display:none;" onclick="confirmR('${id}')">تأكيد الرفض</button>
                                </div>
                            </div>`;
                    } else {
                        const sBadge = data.status === 'approved' ? '<span class="badge badge-success">تم القبول</span>' : '<span class="badge badge-danger">مرفوض</span>';
                        tableBody.innerHTML += `
                            <tr>
                                <td>${data.name}</td>
                                <td>${data.rank}</td>
                                <td>${data.nationalId}</td>
                                <td>${data.phone}</td>
                                <td>${data.type}</td>
                                <td>${sBadge}</td>
                                <td>${data.rejectReason || '-'}</td>
                                <td style="font-weight:bold; color:var(--primary);">${data.processedBy || '-'}</td>
                                <td>${data.processedByRank || '-'}</td>
                            </tr>`;
                    }
                });
            }
        });

        function process(id, status) {
            db.ref('requests/' + id).update({
                status: status,
                processedBy: currentSupName, // تخزين اسم الرقيب اللي وافق
                processedByRank: currentSupRank // تخزين رتبة الرقيب اللي وافق
            });
        }

        function confirmR(id) {
            const reason = document.getElementById('reason-' + id).value;
            if (!reason) { alert('اكتب السبب'); return; }
            db.ref('requests/' + id).update({
                status: 'rejected',
                rejectReason: reason,
                processedBy: currentSupName, // تخزين اسم الرقيب اللي رفض
                processedByRank: currentSupRank
            });
        }
    </script>
</body>
</html>
