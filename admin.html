<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الرخص والأرشفة - تطوير فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --success: #059669; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 1300px; margin: auto; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 5px solid var(--primary); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #f1f1f1; }
        th { background: #f8fafc; color: #64748b; font-size: 0.9rem; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-excel { background: #15803d; color: white; }
        .btn-approve { background: var(--success); color: white; }
        .btn-print { background: var(--accent); color: white; }
        
        .badge-count { background: #eff6ff; color: var(--accent); padding: 5px 12px; border-radius: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>📥 طلبات الاستئذان الجديدة</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم الفرد</th>
                    <th>الرتبة</th>
                    <th>الهوية</th>
                    <th>الجوال</th>
                    <th>الطلب</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="pendingRequests"></tbody>
        </table>
    </div>

    <div class="card">
        <div class="header-flex">
            <h2>🗃️ سجل أرشيف الرخص المعتمدة</h2>
            <button class="btn btn-excel" onclick="exportToExcel()">📊 تصدير الأرشيف للاكسل</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>الرتبة</th>
                    <th>رقم الهوية</th>
                    <th>الجوال</th>
                    <th>إجمالي الرخص</th>
                    <th>خيارات</th>
                </tr>
            </thead>
            <tbody id="archiveTable"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. مراقبة الطلبات الواردة
    db.ref('requests').on('value', snapshot => {
        const pendingBody = document.getElementById('pendingRequests');
        pendingBody.innerHTML = '';
        snapshot.forEach(child => {
            const req = child.val();
            if (req.directedToAdmin && !req.adminAction) {
                pendingBody.innerHTML += `
                    <tr>
                        <td><b>${req.userName}</b></td>
                        <td>${req.userRank || '-'}</td>
                        <td>${req.userID || '-'}</td>
                        <td>${req.userPhone || '-'}</td>
                        <td>${req.requestType}</td>
                        <td><button class="btn btn-approve" onclick="approveAndArchive('${child.key}')">اعتماد ✅</button></td>
                    </tr>`;
            }
        });
    });

    // 2. وظيفة الاعتماد والأرشفة (بناءً على رقم الهوية لمنع التكرار)
    function approveAndArchive(reqId) {
        db.ref('requests/' + reqId).once('value', snapshot => {
            const reqData = snapshot.val();
            const timestamp = new Date().toLocaleString('ar-SA');
            const dateStr = new Date().toLocaleDateString('ar-SA');
            const idKey = reqData.userID || reqData.userName; // استخدام الهوية كمفتاح لمنع التكرار

            db.ref('requests/' + reqId).update({ adminAction: 'approved', approvalTime: timestamp });

            const archiveRef = db.ref('archive').child(idKey);
            archiveRef.once('value', arcSnap => {
                let data = arcSnap.exists() ? arcSnap.val() : { count: 0, history: [] };
                archiveRef.set({
                    name: reqData.userName,
                    rank: reqData.userRank || 'بدون',
                    idNo: reqData.userID || '-',
                    phone: reqData.userPhone || '-',
                    count: data.count + 1,
                    history: [...data.history, { type: reqData.requestType, date: dateStr }]
                });
            });
            alert("تم الاعتماد بنجاح.");
        });
    }

    // 3. عرض الأرشيف في الجدول
    db.ref('archive').on('value', snapshot => {
        const archiveBody = document.getElementById('archiveTable');
        archiveBody.innerHTML = '';
        snapshot.forEach(child => {
            const p = child.val();
            archiveBody.innerHTML += `
                <tr>
                    <td><b>${p.name}</b></td>
                    <td>${p.rank}</td>
                    <td>${p.idNo}</td>
                    <td>${p.phone}</td>
                    <td><span class="badge-count">${p.count}</span></td>
                    <td><button class="btn btn-print" onclick="printIndividualReport('${child.key}')">🖨️ تقرير</button></td>
                </tr>`;
        });
    });

    // 4. وظيفة تصدير الاكسل (دمج التواريخ في صف واحد)
    function exportToExcel() {
        db.ref('archive').once('value', snapshot => {
            const dataForExcel = [];
            
            snapshot.forEach(child => {
                const p = child.val();
                // إنشاء كائن الصف الأساسي
                const row = {
                    "الاسم": p.name,
                    "الرتبة": p.rank,
                    "رقم الهوية": p.idNo,
                    "الجوال": p.phone,
                    "إجمالي الرخص": p.count
                };

                // دمج التواريخ: سيتم إضافة كل تاريخ في عمود منفصل (تاريخ 1، تاريخ 2...)
                p.history.forEach((h, index) => {
                    row[`تاريخ رخصة ${index + 1}`] = h.date;
                });

                dataForExcel.push(row);
            });

            // تحويل البيانات لملف اكسل
            const worksheet = XLSX.utils.json_to_sheet(dataForExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "أرشيف الأفراد");

            // تصدير وتحميل الملف
            XLSX.writeFile(workbook, `أرشيف_الرخص_${new Date().toLocaleDateString()}.xlsx`);
        });
    }

    // (وظيفة الطباعة الفردية تبقى كما هي في الكود السابق)
</script>
</body>
</html>
