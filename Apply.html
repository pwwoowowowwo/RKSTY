<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقديم طلب رخصة - نظام فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--accent); }
        .status-box { margin-top: 20px; background: #eef2f3; padding: 15px; border-radius: 12px; border: 1px dashed #3498db; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>نموذج طلب رخصة 📝</h2>
        
        <label>الاسم الكامل:</label>
        <input type="text" id="uName" placeholder="أدخل اسمك الثلاثي">

        <label>رقم الهوية (للمتابعة):</label>
        <input type="password" id="uID" placeholder="أدخل رقم الهوية">

        <label>تاريخ الاستئذان:</label>
        <input type="date" id="uDate">

        <label>الوردية:</label>
        <select id="uShift">
            <option value="الوردية الأولى">الوردية الأولى</option>
            <option value="الوردية الثانية">الوردية الثانية</option>
            <option value="الوردية الثالثة">الوردية الثالثة</option>
        </select>

        <label>المدة المطلوبة:</label>
        <select id="uDuration">
            <option value="استلام واحد">استلام واحد</option>
            <option value="استلامين">استلامين</option>
        </select>

        <label>توجيه الطلب للرقيب:</label>
        <select id="targetSup">
            <option value="">جاري تحميل قائمة الرقباء...</option>
        </select>

        <label>ملاحظات (اختياري):</label>
        <textarea id="uReason" placeholder="اكتب ملاحظاتك هنا.." rows="2"></textarea>

        <button onclick="sendRequest()">إرسال الطلب الآن 🚀</button>

        <div id="myStatus" class="status-box">
            أدخل رقم هويتك لمتابعة حالة الطلب والردود.
        </div>
    </div>

    <script>
        // الرابط السحابي الخاص بك (تم التحديث)
        const firebaseConfig = { 
            databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. تحميل قائمة الرقباء المضافين في الدعم الفني
        db.ref('settings/supervisors').on('value', snap => {
            let select = document.getElementById('targetSup');
            select.innerHTML = '<option value="">-- اختر الرقيب --</option>';
            snap.forEach(child => {
                let s = child.val();
                select.innerHTML += `<option value="${child.key}">${s.name} (${s.rank})</option>`;
            });
        });

        // 2. إرسال الطلب
        function sendRequest() {
            let id = document.getElementById('uID').value;
            let name = document.getElementById('uName').value;
            let target = document.getElementById('targetSup').value;

            if(!id || !name || !target) return alert("يرجى إكمال البيانات الأساسية");

            let data = {
                name: name,
                uid: id,
                date: document.getElementById('uDate').value,
                shift: document.getElementById('uShift').value,
                duration: document.getElementById('uDuration').value,
                target: target,
                reason: document.getElementById('uReason').value,
                status: "قيد الانتظار عند الرقيب",
                adminReply: "بانتظار المراجعة...",
                timestamp: Date.now()
            };

            db.ref('requests/' + id).set(data).then(() => {
                alert("تم الإرسال بنجاح ✅");
                watchStatus(id);
            });
        }

        // 3. متابعة الردود لحظياً
        function watchStatus(id) {
            db.ref('requests/' + id).on('value', snap => {
                let r = snap.val();
                if(r) {
                    document.getElementById('myStatus').innerHTML = `
                        <b>الحالة:</b> ${r.status}<br>
                        <b>رد الإدارة:</b> <span style="color:green">${r.adminReply}</span>
                    `;
                }
            });
        }

        document.getElementById('uID').oninput = function() {
            if(this.value.length > 5) watchStatus(this.value);
        };
    </script>
</body>
</html>
