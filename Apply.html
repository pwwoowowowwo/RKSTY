<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام طلب الرخص والمتابعة - فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { 
            --primary: #2c3e50; /* لون الأزرار والعناوين الرئيسية */
            --accent: #3498db;  /* لون العناوين الفرعية وحواف التركيز */
            --bg: #00adb5;       /* لون الخلفية الرئيسية من الصورة */
            --card-bg: white;
            --success-color: #27ae60;
            --wait-color: #f39c12;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); padding: 15px; margin: 0; }
        .app-container { max-width: 600px; margin: auto; }
        .main-card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2.card-title { text-align: center; color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; background: #fff; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn-submit { width: 100%; padding: 15px; margin-top: 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: var(--accent); }

        /* ستايل قسم المتابعة (مطابق للصورة الثانية) */
        .search-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-search { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 0 20px; cursor: pointer; font-weight: bold; }
        .request-item { background: #f8fafc; border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid #e2e8f0; position: relative; }
        .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .date-text { color: #666; font-size: 14px; float: left; }
        .details-row { clear: both; color: #555; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="main-card">
            <h2 class="card-title">نموذج طلب رخصة 📝</h2>
            
            <label>الاسم الكامل:</label>
            <input type="text" id="uName" placeholder="أدخل اسمك الثلاثي">

            <label>رقم الهوية:</label>
            <input type="number" id="uID" placeholder="أدخل رقم الهوية">

            <label>تاريخ الاستئذان:</label>
            <input type="date" id="uDate">

            <label>الوردية:</label>
            <select id="uShift">
                <option value="الوردية الأولى">الوردية الأولى</option>
                <option value="الوردية الثانية">الوردية الثانية</option>
                <option value="الوردية الثالثة">الوردية الثالثة</option>
            </select>

            <label>المدة المطلوبة:</label>
            <select id="uDuration">
                <option value="استلام واحد">استلام واحد</option>
                <option value="استلامين">استلامين</option>
                <option value="يوم واحد">يوم واحد</option>
            </select>

            <label>توجيه الطلب للرقيب:</label>
            <select id="targetSup">
                <option value="">جاري تحميل القائمة...</option>
            </select>

            <label>ملاحظات (اختياري):</label>
            <textarea id="uReason" placeholder="اكتب ملاحظاتك هنا.." rows="2"></textarea>

            <button class="btn-submit" onclick="sendRequest()">إرسال الطلب الآن 🚀</button>
        </div>

        <div class="main-card">
            <h2 class="card-title">🔍 متابعة حالة طلبك</h2>
            <p style="text-align:center; color:#666; margin-top:5px;">أدخل رقم الهوية لعرض حالة طلباتك الحالية</p>
            <div class="search-row">
                <input type="number" id="searchID" placeholder="أدخل رقم الهوية">
                <button class="btn-search" onclick="liveTrack()">بحث</button>
            </div>
            <div id="trackingContent">
                <p style="text-align:center; color:#999; margin-top:15px;">ادخل رقم الهوية والضغط على بحث</p>
            </div>
        </div>
    </div>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // تحميل الرقباء
        db.ref('supervisors').on('value', snap => {
            let select = document.getElementById('targetSup');
            select.innerHTML = '<option value="">-- اختر الرقيب المسؤول --</option>';
            snap.forEach(child => {
                select.innerHTML += `<option value="${child.val().name}">${child.val().name} (${child.val().rank})</option>`;
            });
        });

        // وظيفة إرسال الطلب
        function sendRequest() {
            let name = document.getElementById('uName').value;
            let id = document.getElementById('uID').value;
            let target = document.getElementById('targetSup').value;

            if(!name || !id || !target) return alert("يرجى إكمال البيانات الأساسية");

            let data = {
                userName: name,
                nationalID: id,
                requestDate: document.getElementById('uDate').value,
                shift: document.getElementById('uShift').value,
                duration: document.getElementById('uDuration').value,
                directedToName: target,
                notes: document.getElementById('uReason').value,
                status: "بانتظار موافقة الميدان",
                directedBy: target, // تم التوجيه بواسطة الفرد لهذا الرقيب
                directedToAdmin: false,
                timestamp: Date.now()
            };

            db.ref('requests').push(data).then(() => {
                alert("تم إرسال طلبك بنجاح ✅.. يمكنك المتابعة برقم هويتك.");
                document.getElementById('uName').value = "";
                document.getElementById('uID').value = "";
                // يمكن تفعيل البحث التلقائي بعد الإرسال هنا: liveTrackById(id);
            });
        }

        // وظيفة المتابعة الاحترافية (مطابقة للصورة الثانية)
        function liveTrack() {
            const searchID = document.getElementById('searchID').value;
            const content = document.getElementById('trackingContent');
            if(searchID.length < 6) { content.innerHTML = "<p style='text-align:center; color:red; font-size:14px; margin-top:15px;'>رقم الهوية غير صحيح</p>"; return; }

            db.ref('requests').orderByChild('nationalID').equalTo(searchID).on('value', snap => {
                if(!snap.exists()) {
                    content.innerHTML = "<p style='text-align:center; color:#999; margin-top:15px;'> لا توجد طلبات مسجلة لهذا الرقم.</p>";
                    return;
                }

                let html = "";
                snap.forEach(child => {
                    let r = child.val();
                    let isApproved = r.adminAction === 'approved';
                    let isWithAdmin = r.directedToAdmin === true;
                    let color = isApproved ? '#27ae60' : (isWithAdmin ? '#f39c12' : '#e67e22');
                    let statusLabel = isApproved ? "تم الاعتماد النهائي ✅" : (isWithAdmin ? "موجه للإدارة ومغطى ميدانياً" : "بانتظار إقرار الميدان");

                    html += `
                        <div class="request-item">
                            <span class="date-text">${r.requestDate || '-'}</span>
                            <div class="status-badge" style="background:${color}20; color:${color};">
                                ${statusLabel}
                            </div>
                            <div class="details-row">بواسطة: ${r.userName}</div>
                            <div class="details-row" style="margin-top:10px;"><b>الرقيب المقر:</b> ${r.directedBy || 'جاري المراجعة'}</div>
                            <div class="details-row"><b>ملاحظات الإدارة:</b> ${r.adminNotes || '-'}</div>
                        </div>`;
                });
                content.innerHTML = html;
            });
        }
    </script>
</body>
</html>
