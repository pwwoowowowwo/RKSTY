<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام طلب الرخص - فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #00adb5; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); padding: 15px; margin: 0; }
        .main-card { max-width: 550px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { text-align: center; color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { width: 100%; padding: 15px; margin-top: 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        /* قسم الاستعلام */
        .search-box { display: flex; gap: 8px; margin-top: 15px; }
        .btn-search { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 0 20px; cursor: pointer; }
        .result-item { background: #f8fafc; border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid #e2e8f0; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>نموذج طلب رخصة 📝</h2>
        
        <label>الرتبة:</label>
        <select id="uRank">
            <option value="جندي">جندي</option>
            <option value="جندي أول">جندي أول</option>
            <option value="عريف">عريف</option>
            <option value="وكيل رقيب">وكيل رقيب</option>
            <option value="رقيب">رقيب</option>
        </select>

        <label>الاسم الكامل:</label>
        <input type="text" id="uName" placeholder="أدخل اسمك الثلاثي">

        <label>رقم الهوية:</label>
        <input type="number" id="uID" placeholder="أدخل رقم الهوية">

        <label>رقم الجوال:</label>
        <input type="tel" id="uPhone" placeholder="05xxxxxxxx">

        <label>تاريخ الاستئذان:</label>
        <input type="date" id="uDate">

        <label>الوردية:</label>
        <select id="uShift">
            <option value="الوردية الأولى">الوردية الأولى</option>
            <option value="الوردية الثانية">الوردية الثانية</option>
            <option value="الوردية الثالثة">الوردية الثالثة</option>
        </select>

        <label>المدة المطلوبة:</label>
        <select id="uDuration">
            <option value="استلام واحد">استلام واحد</option>
            <option value="استلامين">استلامين</option>
            <option value="يوم واحد">يوم واحد</option>
        </select>

        <label>توجيه الطلب للرقيب:</label>
        <select id="targetSup">
            <option value="">جاري تحميل القائمة...</option>
        </select>

        <button class="btn-submit" onclick="sendRequest()">إرسال الطلب للرقيب 🚀</button>
    </div>

    <div class="main-card">
        <h2 style="font-size: 1.2em;">🔍 متابعة حالة طلبك</h2>
        <div class="search-box">
            <input type="number" id="searchID" placeholder="أدخل رقم الهوية للبحث">
            <button class="btn-search" onclick="liveTrack()">بحث</button>
        </div>
        <div id="trackingContent"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // تحميل الرقباء
        db.ref('supervisors').on('value', snap => {
            let select = document.getElementById('targetSup');
            select.innerHTML = '<option value="">-- اختر الرقيب المسؤول --</option>';
            snap.forEach(child => {
                select.innerHTML += `<option value="${child.val().name}">${child.val().name} (${child.val().rank})</option>`;
            });
        });

        // إرسال الطلب بكامل البيانات
        function sendRequest() {
            let name = document.getElementById('uName').value;
            let id = document.getElementById('uID').value;
            let phone = document.getElementById('uPhone').value;
            let target = document.getElementById('targetSup').value;

            if(!name || !id || !phone || !target) return alert("يرجى إكمال كافة البيانات");

            let data = {
                userRank: document.getElementById('uRank').value,
                userName: name,
                nationalID: id,
                userPhone: phone,
                requestDate: document.getElementById('uDate').value,
                shift: document.getElementById('uShift').value,
                duration: document.getElementById('uDuration').value,
                directedToName: target,
                status: "بانتظار إقرار الميدان",
                directedToAdmin: false,
                timestamp: Date.now()
            };

            db.ref('requests').push(data).then(() => {
                alert("تم إرسال الطلب بنجاح ✅");
                document.getElementById('uName').value = "";
                document.getElementById('uID').value = "";
                document.getElementById('uPhone').value = "";
            });
        }

        function liveTrack() {
            const searchID = document.getElementById('searchID').value;
            const content = document.getElementById('trackingContent');
            db.ref('requests').orderByChild('nationalID').equalTo(searchID).on('value', snap => {
                if(!snap.exists()) { content.innerHTML = "<p style='text-align:center; color:#999;'>لا توجد نتائج</p>"; return; }
                let html = "";
                snap.forEach(child => {
                    let r = child.val();
                    let color = r.adminAction === 'approved' ? '#27ae60' : '#f39c12';
                    html += `
                        <div class="result-item">
                            <span style="float:left; font-size:12px;">${r.requestDate}</span>
                            <div class="status-badge" style="background:${color}20; color:${color};">
                                ${r.adminAction === 'approved' ? 'تم الاعتماد ✅' : r.status}
                            </div>
                            <div style="margin-top:10px; font-size:14px;">طلب: ${r.duration} | الوردية: ${r.shift}</div>
                        </div>`;
                });
                content.innerHTML = html;
            });
        }
    </script>
</body>
</html>
