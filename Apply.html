<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقديم طلب رخصة - نظام فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --primary: #1a365d; --accent: #2d3748; --bg: #f7fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 8px solid var(--primary); }
        .header { text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a5568; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary); }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #2c5282; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color: var(--primary);">نموذج طلب رخصة</h2>
        <p style="color: #718096; margin-top: 5px;">يرجى تعبئة البيانات بدقة</p>
    </div>

    <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="userName" placeholder="أدخل اسمك الرباعي">
    </div>

    <div class="form-group">
        <label>الرتبة</label>
        <input type="text" id="userRank" placeholder="رتبتك العسكرية">
    </div>

    <div class="form-group">
        <label>نوع الطلب</label>
        <select id="requestType">
            <option value="رخصة استثنائية">رخصة استثنائية</option>
            <option value="رخصة اعتيادية">رخصة اعتيادية</option>
            <option value="رخصة مرضية">رخصة مرضية</option>
        </select>
    </div>

    <div class="form-group">
        <label>المدة</label>
        <input type="text" id="duration" placeholder="مثلاً: يوم واحد">
    </div>

    <div class="form-group">
        <label>توجيه الطلب إلى (الرقيب المسؤول)</label>
        <select id="directedToName">
            <option value="">جاري تحميل قائمة الرقباء...</option>
        </select>
    </div>

    <button class="btn-submit" onclick="submitRequest()">إرسال الطلب للميدان ✉️</button>
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. جلب قائمة الرقباء آلياً من مسار الدعم الفني (supervisors)
    db.ref('supervisors').on('value', snapshot => {
        const select = document.getElementById('directedToName');
        select.innerHTML = '<option value="">اختر الرقيب المسؤول</option>';
        
        snapshot.forEach(child => {
            const data = child.val();
            // إضافة اسم الرقيب للقائمة ليختاره الفرد
            select.innerHTML += `<option value="${data.name}">${data.name} (${data.rank})</option>`;
        });
    });

    // 2. وظيفة إرسال الطلب
    function submitRequest() {
        const name = document.getElementById('userName').value;
        const rank = document.getElementById('userRank').value;
        const type = document.getElementById('requestType').value;
        const duration = document.getElementById('duration').value;
        const directedTo = document.getElementById('directedToName').value;

        if(!name || !directedTo) {
            alert("يرجى إكمال البيانات واختيار الرقيب المسؤول");
            return;
        }

        const newRequest = {
            userName: name,
            userRank: rank,
            requestType: type,
            duration: duration,
            directedToName: directedTo, // اسم الرقيب الذي سيظهر الطلب عنده
            directedToAdmin: false,     // لم يصل للإدارة بعد
            status: "بانتظار موافقة الميدان",
            requestDate: new Date().toLocaleDateString('ar-SA'),
            timestamp: new Date().getTime()
        };

        db.ref('requests').push(newRequest).then(() => {
            alert("تم إرسال طلبك بنجاح للرقيب المسؤول.");
            // تصفير الحقول بعد الإرسال
            document.querySelectorAll('input').forEach(i => i.value = '');
        });
    }
</script>

</body>
</html>
