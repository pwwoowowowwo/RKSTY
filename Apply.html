<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نموذج طلب رخصة - نظام فهد المخلفي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #1e293b; --accent: #2563eb; --bg: #f8fafc; --text: #334155; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #00adb5; margin: 0; padding: 0; }
        .app-bar { background: #00adb5; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .container { max-width: 500px; margin: 20px auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text); font-size: 0.95rem; }
        input, select, textarea { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f1f5f9; font-size: 1rem; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #00adb5; background: white; }
        .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* قسم المتابعة */
        .tracking-section { margin-top: 30px; border-top: 2px dashed #e2e8f0; padding-top: 20px; }
        .status-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-top: 10px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .bg-wait { background: #fef3c7; color: #92400e; }
        .bg-done { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="app-bar">
    <h2 style="margin:0; font-size: 1.2rem;">نظام طلب الرخص</h2>
</div>

<div class="container">
    <div class="form-group">
        <label>أدخل اسمك الثلاثي:</label>
        <input type="text" id="userName" placeholder="أدخل اسمك هنا..">
    </div>

    <div class="form-group">
        <label>رقم الهوية (للمتابعة):</label>
        <input type="number" id="userNationalID" placeholder="أدخل رقم الهوية">
    </div>

    <div class="form-group">
        <label>تاريخ الاستئذان:</label>
        <input type="date" id="requestDate">
    </div>

    <div class="form-group">
        <label>الوردية:</label>
        <select id="shift">
            <option value="الوردية الأولى">الوردية الأولى</option>
            <option value="الوردية الثانية">الوردية الثانية</option>
            <option value="الوردية الثالثة">الوردية الثالثة</option>
        </select>
    </div>

    <div class="form-group">
        <label>المدة المطلوبة:</label>
        <select id="duration">
            <option value="استلام واحد">استلام واحد</option>
            <option value="يوم واحد">يوم واحد</option>
            <option value="يومين">يومين</option>
        </select>
    </div>

    <div class="form-group">
        <label>توجيه الطلب للرقيب:</label>
        <select id="directedToName">
            <option value="">-- اختر الرقيب --</option>
        </select>
    </div>

    <div class="form-group">
        <label>ملاحظات (اختياري):</label>
        <textarea id="notes" rows="3" placeholder="اكتب ملاحظاتك هنا.."></textarea>
    </div>

    <button class="btn-submit" onclick="submitRequest()">
        إرسال الطلب الآن 🚀
    </button>

    <div class="tracking-section">
        <label style="text-align: center; color: var(--accent);">🔍 متابعة حالة طلبك</label>
        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <input type="number" id="searchID" placeholder="أدخل رقم هويتك للمتابعة">
            <button onclick="trackRequest()" style="background: var(--accent); color: white; border: none; border-radius: 10px; padding: 0 15px; cursor: pointer;">بحث</button>
        </div>
        <div id="trackingResult"></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://rksti-29fc8-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب الرقباء آلياً من لوحة الدعم الفني
    db.ref('supervisors').on('value', snapshot => {
        const select = document.getElementById('directedToName');
        select.innerHTML = '<option value="">-- اختر الرقيب --</option>';
        snapshot.forEach(child => {
            const data = child.val();
            select.innerHTML += `<option value="${data.name}">${data.name} (${data.rank})</option>`;
        });
    });

    // إرسال الطلب
    function submitRequest() {
        const name = document.getElementById('userName').value;
        const idNo = document.getElementById('userNationalID').value;
        const directed = document.getElementById('directedToName').value;

        if(!name || !idNo || !directed) return alert("يرجى إكمال الاسم ورقم الهوية واختيار الرقيب.");

        db.ref('requests').push({
            userName: name,
            nationalID: idNo,
            requestDate: document.getElementById('requestDate').value,
            shift: document.getElementById('shift').value,
            duration: document.getElementById('duration').value,
            directedToName: directed,
            notes: document.getElementById('notes').value,
            status: "بانتظار الرقيب",
            directedToAdmin: false,
            timestamp: Date.now()
        }).then(() => {
            alert("تم إرسال طلبك بنجاح ✅");
            location.reload();
        });
    }

    // متابعة الطلب برقم الهوية
    function trackRequest() {
        const searchID = document.getElementById('searchID').value;
        const resultDiv = document.getElementById('trackingResult');
        resultDiv.innerHTML = "جاري البحث...";

        db.ref('requests').orderByChild('nationalID').equalTo(searchID).once('value', snapshot => {
            if(!snapshot.exists()) {
                resultDiv.innerHTML = "<p style='color:red; font-size:0.8rem; margin-top:10px;'>لا توجد طلبات مسجلة بهذا الرقم.</p>";
                return;
            }
            resultDiv.innerHTML = "";
            snapshot.forEach(child => {
                const req = child.val();
                const isApproved = req.adminAction === 'approved';
                resultDiv.innerHTML += `
                    <div class="status-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <small>${req.requestDate}</small>
                            <span class="badge ${isApproved ? 'bg-done' : 'bg-wait'}">
                                ${isApproved ? 'تم الاعتماد النهائي ✅' : req.status}
                            </span>
                        </div>
                        <div style="font-size:0.85rem; margin-top:5px; color:#64748b;">
                            بواسطة: ${req.directedToName}
                        </div>
                    </div>
                `;
            });
        });
    }
</script>
</body>
</html>
